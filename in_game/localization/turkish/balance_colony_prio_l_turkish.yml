 BALANCE_PRIO_HELP: "#Y İnşa Öncelikleri#!\n\n- Soldan yapı ya da ham madde ekle; listenin en üstündeki satır önce yapılır.\n- Her satır: Hazine (tabi devletin o kadar altını varken yapar), Aynı anda (kaç tanesi birlikte inşa edilir), Nerede, Sıra (yenisi nereye yapılır), Önce bitsin (alttaki satırlar bekler), Kontrol ve Kâr alt sınırları.\n- Eksi / artı düğmeleri: bir adım, shift+tık on adım. Oklar satırı taşır, X satırı çıkarır.\n- Nerede: kendi illeri, onları seçmek için bir kutu açar: ham madde, eyalet, rütbe ve Kontrol ≥ (eksi / artı yüzde 10) ile süz; nüfusa ya da en çok / en az kontrole göre sırala.\n- Sıklık: tabi devlet listeye ne sıklıkla bakar. Emirler açık / kapalı listeyi açıp kapatır.\n- Yasak: tabi devlet onu hiç yapamaz. AI'ı neye önem versin: kendi kararlarını yönlendirir.\n- Para gönder: hazinemizden tabi devlete altın verir (önce sorar).\n- Send Economic Support oyunun kendi penceresini açar: tabi devlete her ay ne kadar altın gideceğini seç. Sürerken aynı düğme onu iptal eder."
