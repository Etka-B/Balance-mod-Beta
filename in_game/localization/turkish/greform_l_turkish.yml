 l_turkish:
 polish_monarchy_reform: "Polonya Krallık Konsolidasyonu"
 polish_monarchy_reform_desc: "Hukuk kurumları aracılığıyla Piast tacının otoritesini güçlendirmek; devlet idaresini düzene sokmaya, tarımsal üretimi artırmaya ve seçkin ağır süvari geleneklerini geliştirmeye yardımcı olur."

brandenburg_monarchy: "Brandenburg Monarşisi"
brandenburg_monarchy_desc: "Hukuk kurumlarını benimseyip devlet idaresini düzene sokan Brandenburg, tacın otoritesini merkezileştirerek daha yüksek vergi gelirleri elde eder ve kabine verimliliğini artırır."