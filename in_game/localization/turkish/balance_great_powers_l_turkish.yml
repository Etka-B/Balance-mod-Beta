 BALANCE_GP_RULES_TT: "Büyük Güç Puanı (0-10):\nVergi Tabanı: %40\nAsker Gücü: %30\nToplam Gelir: %20\nNüfus: %10\n\nOyuncu Puanları:\n1. Büyük Güç: 5p\n2. Büyük Güç: 4p\n3. Büyük Güç: 3p\n4.-7. Bölgesel Güç: 2p\n8.-22. Küçük Güç: 1p\n\nİttifak Bloğu Sınırı: Bir ittifak bloğu en fazla 10 puandan oluşabilir.\nSavunma Cemiyeti: Savunma cemiyetleri de ittifak statüsünde değerlendirilir."
