 BALANCE_ASSIGN_Q_SUBJ: "…ya da tabi devletlerimizden birine gitsin:"
 BALANCE_ASSIGN_TO_SUBJ: "Buraya gitsin"
 BALANCE_ASSIGN_TO_SUBJ_TT: "Sormadan bu tabi devlete gider"
 BALANCE_ASSIGN_TO_SUBJ_ON: "Buraya gidiyor"
 BALANCE_ASSIGN_TO_SUBJ_ON_TT: "Bu tabi devlete gidiyor.\nDeğiştirmek için başka bir cevaba tıkla."
 BALANCE_ASSIGN_HELP: "#Y Koloni Dağıtımı#!\n\n- Kuralını sağda ayarlamak için bir satıra tıkla. Ok içine girer (bölge, alanlar, eyaletler, iller); yuvarlak iğne haritada gösterir.\n- Kurallar: her seferinde sor, yeni sömürge tabi devleti, bizde kalsın ya da tabi devletlerimizden birine gitsin. En ayrıntılısı geçerlidir: eyalet, sonra alan, sonra bölge.\n- Tek yeni sömürge tabi devleti (bölge ya da alan): orada biten ilk tüzük onu kurar, sonra kural o tabi devlete döner ve sonrakilerin hepsi ona gider.\n- Kendi kuralı olan bir il, eyaleti verildikten sonra taşınır (başkent asla).\n- Kural yoksa ya da tabi devlet artık bizim değilse oyun eskisi gibi sorar."
