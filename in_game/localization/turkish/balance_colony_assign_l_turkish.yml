 BALANCE_ASSIGN_INTRO: "Bir sömürge tüzüğü her bittiğinde oyun eyaletin kime gideceğini soruyor. Soldan bir bölge seç ve oradaki eyaletlerin nereye gideceğini bir kez söyle; "İçine gir" ile bir alana, bir eyalete ya da tek bir ile inip ona ayrı bir cevap da verebilirsin. En ayrıntılı cevap geçerlidir, her cevap istediğin zaman değiştirilebilir. "Sor" olarak kalan her şey oyundaki gibi çalışır."
 BALANCE_ASSIGN_Q_R: "Bu bölgede biten her sömürge tüzüğü:"
