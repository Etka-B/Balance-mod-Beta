 BALANCE_COLONY_HELP: "#Y Yönetim#!\n\n- Soldan bir tabi devlet seç; illeri ortada çıkar. Bir ilin adına tıkla: yapıları sağda görünür; shift+tık ili seçer.\n- Süzgeçler: Hepsi / Kırsal / Kasabalar / Şehirler, Ham madde ya da Yapı sekmesi ve simgeleri, arama kutusu.\n- Bir satırdaki ya da seçimin hepsi için kutular: Kasaba / Şehir yasak (tabi devlet ili yükseltemez), vali korunur (yerel valiyi yıkamaz), yıkılamaz (yapıları yıkamaz), sübvanse (yapılarının zararını öder, AI'ı onları kapatmaz).\n- İl tabi devletin olmaktan çıkınca bütün yasaklar düşer."
