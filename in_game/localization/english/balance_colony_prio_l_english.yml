 BALANCE_PRIO_HELP: "#Y Build priorities#!\n\n- Add buildings or raw materials from the left; the top row of the list goes first.\n- Each row: Treasury (builds only while the subject has that much gold), At once (how many under construction together), Where, Order (where the next one goes), Finish first (the rows below wait), Control and Profit floors.\n- The minus / plus buttons: one step, shift+click ten. The up / down arrows move a row, the X takes it out.\n- Where: its own locations opens a box to pick them: filter by raw material, province, rank and Control ≥ (minus / plus 10 %), sort by population or by most / least control.\n- Every: how often the subject goes down the list. Orders on / off switches the list.\n- Forbidden: the subject can never build that. What its AI cares about steers its own choices.\n- Send gold gives the subject money from our treasury (it asks first).\n- Send Economic Support opens the game's own window: pick how much gold goes to the subject each month. While it runs, the same button cancels it."
