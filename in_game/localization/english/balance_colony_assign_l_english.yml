 BALANCE_ASSIGN_HELP: "#Y Colony assignment#!\n\n- Click a row to set its rule on the right. The arrow goes into it (region, areas, provinces, locations); the round pin shows it on the map.\n- Rules: ask every time, a new colonial subject, stays ours, or goes to one of our subjects. The most specific one wins: province, then area, then region.\n- One new colonial subject (region or area): the first finished charter there forms it, then the rule switches to that subject and every later one goes to it.\n- A location with its own rule moves after its province is handed out (never a capital).\n- With no rule, or a subject that is no longer ours, the game asks as before."
