 BALANCE_ASSIGN_INTRO: "Each time a colonial charter finishes, the game asks who should get the province. Pick a region on the left and say once where its provinces go; with "Open" you can go down to an area, a province or a single location and give it its own answer. The most specific answer wins, and every answer can be changed at any time. Anything left on "Ask" works as in the game."
