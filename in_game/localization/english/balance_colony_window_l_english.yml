 BALANCE_COLONY_HELP: "Red buttons show a bar or lock in force; click a button to switch it. Town / City: the subject may not raise the location. Local governor: it may not take the governor down. Can't be destroyed: it may not destroy the building; for a whole location this also covers buildings built later. Every bar and lock lapses once the location is no longer a subject's. Keep open: a closed building is rebuilt, and the subject pays the losses of those that can be subsidized. Bailiffs, armories and docks (and their upgrades) are never closed by the AI anywhere."
