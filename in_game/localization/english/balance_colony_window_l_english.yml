 BALANCE_COLONY_H_KEEP_OFF_TT: "The subject may destroy the buildings here.\nClick: forbid it for every building here."
 BALANCE_COLONY_H_KEEP_ON_TT: "The subject cannot destroy any building here.\nClick: allow it again."
 BALANCE_COLONY_H_SUB_OFF: "Keep open"
 BALANCE_COLONY_H_SUB_ON: "Kept open"
 BALANCE_COLONY_H_SUB_OFF_TT: "The subject may close its buildings here.\nClick: keep them open. A building it closes is rebuilt, open, at the same level (its production method and staff start over); the ones that can be subsidized are, so it pays their losses and has no loss to close them over. Renewed every day, buildings built later included.\nBailiffs, armories, docks and their upgrades are never closed by the AI anywhere anyway."
 BALANCE_COLONY_H_SUB_ON_TT: "The buildings here are kept open: a closed one is rebuilt open at the same level, and the ones that can be subsidized are (the subject pays their losses). Renewed every day.\nClick: let go (the subsidies are lifted)."
