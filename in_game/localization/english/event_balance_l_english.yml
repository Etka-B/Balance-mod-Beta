 # Flavor Minor Events (Switzerland, Hesse, Flanders, Brandenburg, Florence, Milan)
 flavor_minor.1.title: "Rise of a Regional Power"
 flavor_minor.1.desc: "Our realm stands at a crucial historical juncture. Through strategic diplomacy, internal stability, and economic growth, our nation is beginning to punch above its weight class. The decisions we make today will secure our position among the regional powers for decades to come."
 flavor_minor.1.a: "We shall chart our own destiny."

 flavor_minor.2.title: "Rise of a Regional Power"
 flavor_minor.2.desc: "Our realm stands at a crucial historical juncture. Through strategic diplomacy, internal stability, and economic growth, our nation is beginning to punch above its weight class. The decisions we make today will secure our position among the regional powers for decades to come."
 flavor_minor.2.a: "We shall chart our own destiny."

 # Muscovy Event
 flavor_muscovy.1.title: "The Rising Power of the North"
 flavor_muscovy.1.desc: "Rising from the depths of the northern lands and forests, our principality is beginning to establish dominance over the surrounding territories. By strengthening our military might and administrative structure, we must prove that we are the true masters of the Russian lands."
 flavor_muscovy.1.a: "The Muscovite lands shall be united!"

 # Sweden Event (Legacy of Ragnar)
 flavor_sweden.1.title: "The Legacy of Ragnar"
 flavor_sweden.1.desc: "Though generations have passed since Christianity took root in Swedish lands, whispers of the old gods still linger. A skilled leader claiming descent from the legendary Ragnar Lodbrok has emerged. While the Catholic Church views him as a threat, many long for a return to the ancient ways."
 flavor_sweden.1.historical_info: "Following Sweden's Christianization, pagan traditions and the legacy of legendary figures like Ragnar Lodbrok left a profound mark on Nordic heritage."
 flavor_sweden.1.a: "There is no place for heretics in our court! We remain faithful to Christ."
 flavor_sweden.1.b: "Valhalla calls to us! Hail Ragnar, return to the old gods!"
