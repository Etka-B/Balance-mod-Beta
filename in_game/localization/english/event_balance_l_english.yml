 # Flavor Minor Events
 flavor_minor.1.title: "Rise of a Regional Power"
 flavor_minor.1.desc: "Our realm stands at a crucial historical juncture. Through strategic diplomacy, internal stability, and economic growth, our nation is beginning to punch above its weight class. The decisions we make today will secure our position among the regional powers for decades to come."
 flavor_minor.1Based on the provided event files, here is a detailed breakdown of all the triggers, requirements, and outcomes for the `flavor_minor`, `flavor_muscovy`, and `flavor_sweden` events.

---

### **Flavor Minor Events (`flavor_minor`)**

All events in this file target a specific country tag, require `is_human = yes`[cite: 1], and share the following timeline specifications[cite: 1]:
* **Timeframe:** January 1, 1337 – January 1, 1350[cite: 1]
* **Monthly Chance:** 100%[cite: 1]
* **One-time event:** Yes (`fire_only_once = yes`)[cite: 1]

| Event ID | Target Tag | Effects / Outcomes |
| :--- | :--- | :--- |
| **`flavor_minor.1`** | `SWI` (Switzerland)[cite: 1] | * **Option A:** Gains severe stability bonus (`stability_severe_bonus`)[cite: 1] and the `minor_massive_bonus` country modifier for 50 years[cite: 1]. |
| **`flavor_minor.2`** | `HES` (Hesse)[cite: 1] | * **Option A:** Gains severe stability bonus (`stability_severe_bonus`)[cite: 1], mild legitimacy bonus (`legitimacy_mild_bonus`)[cite: 1], and `minor_massive_bonus` for 50 years[cite: 1]. |
| **`flavor_minor.3`** | `FLA` (Flanders)[cite: 1] | * **Option A:** Gains severe stability bonus (`stability_severe_bonus`)[cite: 1], mild legitimacy bonus (`legitimacy_mild_bonus`)[cite: 1], and `minor_massive_bonus` for 50 years[cite: 1]. |
| **`flavor_minor.4`** | `BRA` (Brandenburg)[cite: 1] | * **Option A:** Gains severe stability bonus (`stability_severe_bonus`)[cite: 1], mild legitimacy bonus (`legitimacy_mild_bonus`)[cite: 1], and `minor_massive_bonus` for 50 years[cite: 1]. |
| **`flavor_minor.5`** | `FLO` (Florence)[cite: 1] | * **Option A:** Gains severe stability bonus (`stability_severe_bonus`)[cite: 1] and the `minor_massive_bonus.2` country modifier for 50 years[cite: 1]. |
| **`flavor_minor.6`** | `MLO` (Milan)[cite: 1] | * **Option A:** Gains severe stability bonus (`stability_severe_bonus`)[cite: 1] and the `minor_massive_bonus.2` country modifier for 50 years[cite: 1]. |

