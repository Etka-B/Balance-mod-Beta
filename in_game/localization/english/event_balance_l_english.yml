### **Flavor Muscovy Event (`flavor_muscovy`)**

**`flavor_muscovy.1`**
* **Target:** `MOS` (Muscovy)[cite: 2]
* **Timeframe:** January 1, 1337 – January 1, 1350 (Monthly Chance: 100%, Fire once)[cite: 2]
* **Trigger:** `is_human = yes`[cite: 2]
* **Option A:** Adds the `muscovy_massive_bonus` country modifier for 50 years[cite: 2].

---

### **Flavor Sweden Event (`flavor_sweden`)**

**`flavor_sweden.1` ("The Legacy of Ragnar")**
* **Target:** `SWE` (Sweden)[cite: 3]
* **Timeframe:** January 1, 1337 – January 1, 1470 (Monthly Chance: 3%, Fire once)[cite: 3]
* **Triggers:**
  * Religion is Catholic[cite: 3]
  * Owns the location of Stockholm[cite: 3]
  * At peace (`at_war = no`)[cite: 3]
  * Is not a subject country[cite: 3]
  * Has no active regent[cite: 3]
* **Immediate Effects:** Creates the `lodbrok_dynasty`[cite: 3] and generates a highly-skilled Norse Swedish character named Ragnar Lodbrok (Stats: 80–100 across ADM, DIP, MIL)[cite: 3].
* **Options:**
  * **Option A (Historical):** Rejects the heretic[cite: 3]. Grants a severe stability bonus (`stability_severe_bonus`)[cite: 3], a mild legitimacy bonus (`legitimacy_mild_bonus`)[cite: 3], and the `minor_massive_bonus` country modifier for 50 years[cite: 3].
  * **Option B:** Reverts to the Old Gods[cite: 3]. Sets Ragnar Lodbrok as ruler[cite: 3], converts the country, ruler, and ruling family to the Norse religion[cite: 3], reduces stability by 60[cite: 3], and reduces legitimacy by 30[cite: 3]. Removes `enacted_placitum_regium` if active[cite: 3].